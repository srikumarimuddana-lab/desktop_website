name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # Build-time env is intentionally minimal: the app's own fallbacks
          # (mock Supabase client, unconfigured-provider guards in
          # lib/langchain.js) are what's under test here — this CI job checks
          # the build compiles and renders without secrets, not that live
          # integrations work.
          NODE_ENV: production
